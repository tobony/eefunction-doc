name: Normalize legacy documentation domain

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-domain.yml

permissions:
  contents: write

jobs:
  update-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace legacy documentation URL
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "https://eefunction-doc.pages.dev"
          new = "https://eefunction-doc.brbrsoft.com"
          paths = [
              Path("src/content/docs/user-guide/privacy-policy.mdx"),
              Path("src/content/docs/ko/user-guide/privacy-policy.mdx"),
          ]

          for path in paths:
              text = path.read_text(encoding="utf-8")
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit domain-only changes
        run: |
          if git diff --quiet; then
            echo "No legacy domain references found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/user-guide/privacy-policy.mdx src/content/docs/ko/user-guide/privacy-policy.mdx
          git commit -m "Update legacy documentation URLs"
          git push
