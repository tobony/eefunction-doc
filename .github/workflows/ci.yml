name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Astro type-check tools
        run: npm install --no-save --package-lock=false @astrojs/check@0.9.4 typescript@5.9.3

      - name: Run Astro diagnostics
        run: npm run astro -- check

      - name: Build documentation
        run: npm run build
